[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoxtail"
version = "0.1.0"
description = "The engine behind every Phoxtail project."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [{ name = "Phoxmor", email = "info@phoxtail.com" }]
maintainers = [{ name = "Evangelos Pisinas", email = "evangelos.pisinas@phoxtail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Wagtail",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.0.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://phoxtail.com"
Repository = "https://github.com/phoxmor/phoxtail"

[project.scripts]
phoxtail = "phoxtail.__main__:app"

[tool.setuptools.packages.find]
include = ["phoxtail*"]
exclude = ["phoxtail.tests*"]

[tool.setuptools.package-data]
phoxtail = ["templates/**/*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
testpaths = ["phoxtail/tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
