[build-system]
requires = ["setuptools>=77.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoxtail"
dynamic = ["version"]
description = "The framework for agentic platforms."
keywords = ["agentic", "agents", "mcp", "framework", "django", "wagtail", "cms"]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [{ name = "Phoxmor", email = "info@phoxtail.com" }]
maintainers = [{ name = "Evangelos Pisinas", email = "evangelos.pisinas@phoxtail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Wagtail",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.27.1",
    "rich>=15.0.0",
    "questionary>=2.1.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    # The server, the peer client and the caller-identity gate all come
    # from fastmcp, so it is one dependency rather than three. The slim
    # distribution is the one pydantic-ai already resolves for its own MCP
    # client; [server] adds the ASGI stack `phoxtail mcp serve --http`
    # needs, and brings mcp 2.x (the stateless protocol) with it.
    "fastmcp-slim[server]>=4.0.0,<5",
]

[project.optional-dependencies]
engine = [
    # Django 6.0 drops Python 3.11, which requires-python still allows.
    "django>=5.2.15,<6.0",
    # An open upper bound would promise majors that do not exist yet.
    "wagtail>=8.0,<9.0",
    "celery>=5.6.3",
    "django-ninja>=1.6.2",
    "django-allauth>=65.18.0",
    "django-htmx>=1.29.0",
    "django-countries>=9.0.0",
    "django-phonenumber-field[phonenumbers]>=8.4.0",
    # The split phone field builds its country-prefix choices with babel,
    # which django-phonenumber-field leaves to the caller to install.
    "babel>=2.17.0",
    "django-filter>=25.2",
    "wagtail-color-panel>=1.8.1",
    "wagtailmedia>=0.18.1",
    "sorl-thumbnail>=13.0.0",
    "fonttools[woff]>=4.63.0",
    "redis>=8.0.1",
]
dashboard = [
    "phoxtail[engine]",
]
chatbot = [
    "phoxtail[engine]",
    "pydantic-ai>=1.107.0",
    # Chat prose markdown -> HTML (also arrives transitively via rich)
    "markdown-it-py>=4.2.0",
]
# The screenshot tools in phoxtail.mcp.studio, and nothing else. A browser
# stack is a heavy thing to install by default for a CLI that mostly does
# not render, so both imports are lazy and this extra is what turns them on.
# No engine dependency: the tools reach the site over HTTP, so they work
# from a client-only install.
studio = [
    "playwright>=1.62.0",
    "Pillow>=12.3.0",
]
# Test/lint toolchain only — no feature extras. Projects put this in their
# PEP 735 dev dependency group so production builds can exclude it wholesale
# (uv sync --no-dev in the Dockerfile's production builder stage).
dev-tools = [
    "pip-tools>=7.5.3",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-httpx>=0.36.2",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.18",
    "mypy>=2.3.1",
    "factory-boy>=3.3.3",
    "towncrier>=25.8.0",
    "freezegun>=1.5.5",
    "ipython>=9.14.1",
]
# Deprecated alias: "everything for local development". Projects hatched
# before the dependency-groups split depend on this as a runtime dependency;
# keep it until they are retrofitted to explicit feature extras + a dev group.
dev = [
    "phoxtail[dev-tools,engine,dashboard,chatbot,studio]",
]

[project.urls]
Homepage = "https://phoxtail.com"
Repository = "https://github.com/phoxmor/phoxtail"
Documentation = "https://docs.phoxtail.com"
Issues = "https://github.com/phoxmor/phoxtail/issues"
Changelog = "https://github.com/phoxmor/phoxtail/blob/main/CHANGELOG.md"

[project.scripts]
phoxtail = "phoxtail.__main__:app"

[tool.setuptools.dynamic]
version = { attr = "phoxtail.__version__" }

[tool.setuptools.packages.find]
include = ["phoxtail*"]
# Tests are not part of the distribution: they inflate every install and,
# once inside site-packages, a user's own pytest run can collect them.
exclude = [
    "phoxtail*.tests",
    "phoxtail*.tests.*",
]

[tool.setuptools.package-data]
"phoxtail" = ["py.typed", "project_template/**/*", "project_template/**/.*"]
"phoxtail.cli" = ["templates/**/*"]
"phoxtail.users" = ["templates/**/*", "static/**/*"]
"phoxtail.core" = ["templates/**/*", "static/**/*"]
"phoxtail.cms" = ["templates/**/*", "static/**/*"]
"phoxtail.agent" = ["templates/**/*", "static/**/*"]
"phoxtail.tokens" = ["templates/**/*", "static/**/*"]
"phoxtail.streams" = ["templates/**/*", "static/**/*"]
"phoxtail.remotes" = ["templates/**/*", "static/**/*"]
"phoxtail.dashboard" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Discovered, not enumerated: a hand-kept list drifts silently, and its
# failure mode is a green run that skipped an app.
testpaths = ["phoxtail"]
# make test-floors builds a second environment in the repo root; without
# this, a run pointed at the root would collect the tests vendored inside it.
norecursedirs = [".floors-venv", ".venv", "build", "dist"]
DJANGO_SETTINGS_MODULE = "phoxtail.core.tests.settings"

# Migrations are generated and the project template is scaffolding rendered into
# someone else's repository; neither is code anyone would act on a number for.
[tool.coverage.run]
# A package name rather than a directory path: phoxtail/ also holds Dockerfiles
# and other templates, and coverage fails while reporting when it tries to parse
# those as Python.
source_pkgs = ["phoxtail"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/project_template/*",
]

[tool.coverage.report]
# `if TYPE_CHECKING:` never executes at runtime by design, so counting it as a
# miss measures the annotations rather than the code.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
skip_covered = false

[tool.mypy]
python_version = "3.11"
# Django, Wagtail and most of the plugin set ship no type information, so
# without this every import from them is an error about the dependency
# rather than about this code.
ignore_missing_imports = true
exclude = ["/migrations/", "/tests/", "project_template/"]

# The changelog is compiled from news fragments in newsfragments/, one per
# user-visible change, written in the commit that makes the change. Headings
# and their order are Keep a Changelog's; the array form fixes the order,
# where the table form would sort them alphabetically.
[tool.towncrier]
directory = "newsfragments"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] \u2014 {project_date}"
issue_format = "[#{issue}](https://github.com/phoxmor/phoxtail/issues/{issue})"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
