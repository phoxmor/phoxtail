[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoxtail"
dynamic = ["version"]
description = "The framework for agentic platforms."
keywords = ["agentic", "agents", "mcp", "framework", "django", "wagtail", "cms"]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [{ name = "Phoxmor", email = "info@phoxtail.com" }]
maintainers = [{ name = "Evangelos Pisinas", email = "evangelos.pisinas@phoxtail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Wagtail",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    # Upper bound is deliberate: mcp 2.0 renamed FastMCP to MCPServer and
    # dropped the ambient request context our tools read the caller's Bearer
    # from. Lift it once fastmcp (via pydantic-ai) supports mcp 2.x.
    "mcp>=1.28,<2",
    "playwright>=1.40",
    "Pillow>=10.0",
]

[project.optional-dependencies]
engine = [
    "django>=4.2",
    "wagtail>=7.4",
    "celery>=5.0",
    "django-ninja>=1.3",
    "django-allauth>=0.60",
    "django-htmx>=1.17.0",
    "django-countries>=7.0",
    "django-phonenumber-field[phonenumbers]>=7.0",
    "django-filter>=23.0",
    "wagtail-color-panel>=0.4.0",
    "wagtailmedia>=0.15",
    "sorl-thumbnail>=12.10",
    "fonttools[woff]>=4.43",
    "redis>=5.0",
]
dashboard = [
    "phoxtail[engine]",
]
chatbot = [
    "phoxtail[engine]",
    "pydantic-ai>=1.89",
    # Chat prose markdown -> HTML (also arrives transitively via rich)
    "markdown-it-py>=3.0",
]
# Test/lint toolchain only — no feature extras. Projects put this in their
# PEP 735 dev dependency group so production builds can exclude it wholesale
# (uv sync --no-dev in the Dockerfile's production builder stage).
dev-tools = [
    "pip-tools>=7.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.4.0",
    "factory-boy>=3.3",
    "freezegun>=1.2",
    "ipython>=8.0",
]
# Deprecated alias: "everything for local development". Projects hatched
# before the dependency-groups split depend on this as a runtime dependency;
# keep it until they are retrofitted to explicit feature extras + a dev group.
dev = [
    "phoxtail[dev-tools,engine,dashboard,chatbot]",
]

[project.urls]
Homepage = "https://phoxtail.com"
Repository = "https://github.com/phoxmor/phoxtail"

[project.scripts]
phoxtail = "phoxtail.__main__:app"

[tool.setuptools.dynamic]
version = { attr = "phoxtail.__version__" }

[tool.setuptools.packages.find]
include = ["phoxtail*"]
# Tests are not part of the distribution: they inflate every install and,
# once inside site-packages, a user's own pytest run can collect them.
exclude = [
    "phoxtail*.tests",
    "phoxtail*.tests.*",
]

[tool.setuptools.package-data]
"phoxtail" = ["project_template/**/*", "project_template/**/.*"]
"phoxtail.cli" = ["templates/**/*"]
"phoxtail.users" = ["templates/**/*", "static/**/*"]
"phoxtail.core" = ["templates/**/*", "static/**/*"]
"phoxtail.cms" = ["templates/**/*", "static/**/*"]
"phoxtail.agent" = ["templates/**/*", "static/**/*"]
"phoxtail.tokens" = ["templates/**/*", "static/**/*"]
"phoxtail.streams" = ["templates/**/*", "static/**/*"]
"phoxtail.remotes" = ["templates/**/*", "static/**/*"]
"phoxtail.dashboard" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Discovered, not enumerated: a hand-kept list drifts silently, and its
# failure mode is a green run that skipped an app.
testpaths = ["phoxtail"]
DJANGO_SETTINGS_MODULE = "phoxtail.core.tests.settings"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
