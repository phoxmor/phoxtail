[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoxtail"
version = "0.1.2"
description = "The engine behind every Phoxtail project."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [{ name = "Phoxmor", email = "info@phoxtail.com" }]
maintainers = [{ name = "Evangelos Pisinas", email = "evangelos.pisinas@phoxtail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Wagtail",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "playwright>=1.40",
    "Pillow>=10.0",
]

[project.optional-dependencies]
engine = [
    "django>=4.2",
    "wagtail>=6.0",
    "celery>=5.0",
    "django-ninja>=1.3",
    "django-allauth>=0.60",
    "django-htmx>=1.17.0",
    "django-countries>=7.0",
    "django-phonenumber-field[phonenumbers]>=7.0",
    "django-filter>=23.0",
    "wagtail-color-panel>=0.4.0",
    "wagtailmedia>=0.15",
    "sorl-thumbnail>=12.10",
    "fonttools[woff]>=4.43",
]
dashboard = [
    "phoxtail[engine]",
]
chatbot = [
    "phoxtail[engine]",
    "pydantic-ai>=1.89",
]
dev = [
    "pip-tools>=7.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.4.0",
    "freezegun>=1.2",
    "ipython>=8.0",
    "phoxtail[engine,dashboard,chatbot]",
]

[project.urls]
Homepage = "https://phoxtail.com"
Repository = "https://github.com/phoxmor/phoxtail"

[project.scripts]
phoxtail = "phoxtail.__main__:app"

[tool.setuptools.packages.find]
include = ["phoxtail*"]
exclude = [
    "phoxtail.cli.tests*",
]

[tool.setuptools.package-data]
"phoxtail" = ["project_template/**/*", "project_template/**/.*"]
"phoxtail.cli" = ["templates/**/*"]
"phoxtail.users" = ["templates/**/*", "static/**/*"]
"phoxtail.core" = ["templates/**/*", "static/**/*"]
"phoxtail.design" = ["management/data/**/*"]
"phoxtail.cms" = ["templates/**/*", "static/**/*"]
"phoxtail.agent" = ["templates/**/*", "static/**/*"]
"phoxtail.tokens" = ["templates/**/*", "static/**/*"]
"phoxtail.streams" = ["templates/**/*", "static/**/*", "management/data/**/*"]
"phoxtail.dashboard" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
testpaths = ["phoxtail/cli/tests", "phoxtail/core/tests", "phoxtail/dashboard/tests", "phoxtail/design/tests", "phoxtail/streams/tests", "phoxtail/tokens/tests", "phoxtail/media/tests"]
DJANGO_SETTINGS_MODULE = "phoxtail.core.tests.settings"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
