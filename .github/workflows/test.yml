name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv sync --all-extras --python ${{ matrix.python-version }}

      # Every job must land on the Django the engine extra declares. Without
      # this the resolver picks per-interpreter and the version under test is
      # whatever happens to be newest — which is how three of four jobs once
      # ran a major nobody chose. Update alongside the bound in pyproject.toml.
      - name: Assert the Django under test is the declared one
        run: >
          uv run --python ${{ matrix.python-version }}
          python -c "import django, sys; v = django.get_version(); print(v);
          sys.exit(0 if django.VERSION[:2] == (5, 2) else f'expected 5.2, resolved {v}')"

      # Most migration bloat is accidental drift — a model edited without a
      # matching migration — which stays invisible until someone runs
      # makemigrations. Runs on every column rather than one: the check takes
      # seconds, and a guard gated on a matrix value stops running silently if
      # that value is ever requoted.
      - name: Assert models and migrations agree
        run: make check-migrations

      # On the run that already happens: a job of its own would pay for a second
      # checkout, sync and suite to learn one number.
      - run: uv run --python ${{ matrix.python-version }} pytest -n auto --cov --cov-report=term

      # Into the run summary, because a number only in the log is one nobody
      # reads. Written by every matrix job, so the summary carries four copies.
      - name: Report coverage in the run summary
        run: |
          {
            echo "### Coverage — Python ${{ matrix.python-version }}"
            echo
            echo '```'
            uv run --python ${{ matrix.python-version }} coverage report --format=total \
              | sed 's/^/total: /;s/$/%/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # All branches, so the news-fragment check below can compare against
          # the pull request's base without fetching — which it could not do,
          # having no credential.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # ruff lives in the dev-tools extra, which `uv run` would not sync.
      - run: uv sync --extra dev-tools

      - run: make lint-check

      # Only on pull requests: the check needs a base branch to compare
      # against, and a direct push to main has none. That gap is covered by
      # the commit-msg hook in .githooks/ instead.
      #
      # The base branch comes from the checkout above rather than a git fetch
      # here. Fetching would need a credential, and this job deliberately
      # keeps none — see fetch-depth on the checkout step.
      - name: Assert the change carries a news fragment
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          # The same rule the commit-msg hook applies, so a contributor is
          # never told one thing locally and another here: a fragment is
          # required only for changes that could reach a user. A dependency
          # bump or a workflow edit is not one.
          changed=$(git diff --name-only "origin/$BASE_BRANCH...HEAD" -- 'phoxtail/**' \
            | grep -vE '(^|/)tests/' || true)
          if [ -z "$changed" ]; then
            echo "Nothing under phoxtail/ outside tests/ — no fragment required."
            exit 0
          fi
          echo "$changed"
          uv run towncrier check --compare-with "origin/$BASE_BRANCH"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # One interpreter, matching [tool.mypy] python_version. Stubs for the
      # engine come from the full extra set, so annotations resolve the same
      # way they do locally.
      - run: uv sync --all-extras

      - run: make typecheck

  # Workflow YAML is code with credentials attached, and it is the code least
  # likely to be reviewed. zizmor catches unpinned actions, template injection,
  # over-broad permissions and persisted credentials.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - run: uv tool run zizmor --persona=regular .github/workflows/

  package:
    # The wheel is what users receive, and the local editable install never
    # builds one. Every packaging defect found so far was invisible until
    # someone unpacked the artifact — this job is that unpacking, automated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # A stale egg-info serves a cached file list, which makes a correct
      # packaging fix read as inert. A checkout is clean, but the build is
      # only trustworthy if it stays that way.
      - name: Build sdist and wheel from a clean tree
        run: |
          rm -rf dist build phoxtail.egg-info
          uv build

      - name: Inspect the artifacts
        run: |
          python3 - <<'PY'
          import pathlib, sys, tarfile, zipfile

          dist = pathlib.Path("dist")
          sdist = next(dist.glob("*.tar.gz"))
          wheel = next(dist.glob("*.whl"))

          with tarfile.open(sdist) as tar:
              # Drop the version-stamped top directory so paths match the wheel.
              sdist_names = [n.split("/", 1)[1] for n in tar.getnames() if "/" in n]
          with zipfile.ZipFile(wheel) as zf:
              wheel_names = zf.namelist()

          failures = []

          # Package data is declared in pyproject.toml, and a glob that stops
          # matching fails silently. One file from each rule is enough to catch
          # a rule that has gone dead.
          for required in (
              "phoxtail/py.typed",
              "phoxtail/cli/templates/docker/Dockerfile",
              "phoxtail/project_template/manage.py",
          ):
              for label, names in (("sdist", sdist_names), ("wheel", wheel_names)):
                  if required not in names:
                      failures.append(f"{required} missing from {label}")

          # The exclude in pyproject.toml is a pattern, not a list, but nothing
          # stops a future suite landing outside it. conftest.py counts: it is
          # the one test file that lives outside a tests package by convention.
          for label, names in (("sdist", sdist_names), ("wheel", wheel_names)):
              tests = [
                  n for n in names
                  if (name := pathlib.PurePosixPath(n).name).startswith("test_")
                  or name == "conftest.py"
              ]
              if tests:
                  failures.append(f"{len(tests)} test files in {label}: {tests[:5]}")

          # A silent pass cannot be told apart from a check that ran on an
          # empty list, so say what was actually inspected.
          print(f"sdist {sdist.name}: {len(sdist_names)} entries")
          print(f"wheel {wheel.name}: {len(wheel_names)} entries")
          for line in failures:
              print(f"FAIL {line}")
          sys.exit(1 if failures else 0)
          PY

      - name: Install the wheel and smoke the CLI
        # Outside the repo root on purpose: from inside, `import phoxtail`
        # resolves to the source tree and the wheel is never exercised.
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/phoxtail" version
