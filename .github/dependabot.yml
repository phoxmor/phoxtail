version: 2
updates:
  # Actions are pinned to commit SHAs, which stops a tag being repointed under
  # us — and also stops fixes arriving. Dependabot is the other half of that
  # trade: it turns a silent risk into a reviewable pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Python, added because the dependency-graph job scans this repository whether
  # it is declared here or not — and failed on every run until it was, because
  # phoxtail/project_template/pyproject.toml is a Jinja template rather than a
  # manifest: `phoxtail[...]~={{ phoxtail_version }}` is not a PEP 508
  # specifier, and the parser raises InvalidRequirement rather than skipping it.
  #
  # `increase-if-necessary` rather than the default `increase`, because a floor
  # here is a promise about the oldest version a user may bring, and every one
  # of them is a version the test suite actually installs (see the Floors
  # workflow). The default raises a floor to chase each release, which would
  # falsify that claim and turn the job red. This one leaves a constraint alone
  # while the new version still satisfies it — which, with every dependency
  # declared as a `>=x,<y` range, is the ordinary case.
  # (`widen` is not accepted for pip; it is a composer/npm value.)
  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase-if-necessary
    exclude-paths:
      - phoxtail/project_template/**
    schedule:
      interval: weekly
    commit-message:
      prefix: build
