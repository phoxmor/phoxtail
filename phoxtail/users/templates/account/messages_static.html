{# account/messages_static.html — Messages infrastructure (CSS, JS, toast template). #}
{# Include once per page, outside #messages-container-wrapper, alongside modal media. #}
{% load static phoxtail_design_tags i18n %}
<link rel="stylesheet" href="{% static 'phoxtail_core/css/account/messages.css' %}">
<script src="{% static 'phoxtail_core/js/messages.js' %}" defer></script>
<template id="toast-template"
          data-label-error="{% trans 'Error' %}"
          data-label-success="{% trans 'Success' %}"
          data-label-warning="{% trans 'Warning' %}"
          data-label-info="{% trans 'Info' %}">
    <div class="phx-toast phx-popover phx-toast--hidden">
        <div class="phx-toast__body">
            <span class="phx-toast__label" data-toast-label></span>
            <p class="phx-toast__text" data-toast-text></p>
        </div>
        <button type="button" onclick="dismissMessage(this)" class="phoxtail-close-btn phoxtail-close-btn--xsmall" aria-label="{% trans 'Dismiss' %}">{% icon "close" %}</button>
    </div>
</template>
