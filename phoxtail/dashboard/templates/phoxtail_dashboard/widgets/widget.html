{% load phoxtail_dashboard_tags %}
<a class="dash-widget phx-card phx-card--clickable" href="{% url data.url_name %}">
    <span class="phx-card__title">
        {% if data.icon %}
            {% dashboard_icon_path data.icon as icon_template %}
            <span class="dash-widget__icon">{% include icon_template %}</span>
        {% endif %}
        {{ data.title }}
    </span>
    {% if data.description %}<span class="phx-card__text">{{ data.description }}</span>{% endif %}
</a>
