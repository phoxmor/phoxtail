{% url 'users_management:admin_users_search' as search_url %}
<form id="users-search-form" class="bkua-search-form">
    <div class="bkua-search-wrap">
        <input type="text"
               name="{{ filterset.form.search.html_name }}"
               id="users-search-input"
               value="{{ filterset.form.search.value|default:'' }}"
               placeholder="Search…"
               class="bkua-search-input"
               hx-get="{{ search_url }}"
               hx-include="#users-filters-without-search-form-placeholder"
               hx-target="this"
               hx-swap="none"
               hx-trigger="input changed delay:500ms">
        <!-- Icon container - toggles between search icon and clear button -->
        <div class="bkua-search-icon-wrap">
            <!-- Search Icon - shown when no input -->
            <div id="users-search-icon"
                 class="{% if filterset.form.search.value %}bkua-search-hidden{% endif %}">
                {% include 'phoxtail_core/svgs/search.html' %}
            </div>
            <!-- Clear Search Button - shown when there's input -->
            <button type="button"
                    id="users-clear-search"
                    hx-get="{{ search_url }}"
                    hx-include="#users-filters-without-search-form-placeholder"
                    hx-target="#users-search-input"
                    hx-swap="none"
                    class="bkua-search-clear {% if not filterset.form.search.value %}bkua-search-hidden{% endif %}">
                {% include 'phoxtail_core/svgs/close.html' %}
            </button>
        </div>
    </div>
</form>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('users-search-input');
        const clearButton = document.getElementById('users-clear-search');
        const searchIcon = document.getElementById('users-search-icon');

        if (!searchInput) return;

        if (clearButton) {
            clearButton.addEventListener('click', function() {
                searchInput.value = '';
                searchIcon.classList.remove('bkua-search-hidden');
                clearButton.classList.add('bkua-search-hidden');
            });
        }

        searchInput.addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                searchIcon.classList.add('bkua-search-hidden');
                clearButton.classList.remove('bkua-search-hidden');
            } else {
                searchIcon.classList.remove('bkua-search-hidden');
                clearButton.classList.add('bkua-search-hidden');
            }
        });
    });
</script>
