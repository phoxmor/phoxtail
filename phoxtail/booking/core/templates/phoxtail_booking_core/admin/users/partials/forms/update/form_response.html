{% if messages %}
    <div hx-swap-oob="innerHTML:#messages-container-wrapper">{% include "account/messages.html" %}</div>
{% endif %}
<!-- Always re-render the edit form (with or without errors) -->
<div hx-swap-oob="innerHTML:#core-modal-placeholder">
    {% include "phoxtail_booking_core/admin/users/partials/forms/update/form.html" %}
</div>
{% if not form.errors %}
    <!-- Refresh the users list on success -->
    <div hx-swap-oob="innerHTML:#users-container">{% include 'phoxtail_booking_core/admin/users/partials/users.html' %}</div>
{% endif %}
