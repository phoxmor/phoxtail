{% url 'billing_management:admin_billing_search' as search_url %}
<form id="billing-search-form" class="suba-search-form">
    <div class="suba-search-wrap">
        <input type="text"
               name="{{ filterset.form.search.html_name }}"
               id="billing-search-input"
               value="{{ filterset.form.search.value|default:'' }}"
               placeholder="Search…"
               class="suba-search-input"
               hx-get="{{ search_url }}"
               hx-include="#billing-filters-without-search-form-placeholder"
               hx-target="this"
               hx-swap="none"
               hx-trigger="input changed delay:500ms">
        <!-- Left Icon Container - toggles between search icon and clear button -->
        <div class="suba-search-icon-wrap">
            <!-- Search Icon - shown when no input -->
            <div id="billing-search-icon"
                 class="{% if filterset.form.search.value %}suba-search-hidden{% endif %}">
                {% include 'phoxtail_core/svgs/search.html' %}
            </div>
            <!-- Clear Search Button - shown when there's input -->
            <button type="button"
                    id="billing-clear-search"
                    hx-get="{{ search_url }}"
                    hx-include="#billing-filters-without-search-form-placeholder"
                    hx-target="#billing-search-input"
                    hx-swap="none"
                    class="suba-search-clear {% if not filterset.form.search.value %}suba-search-hidden{% endif %}">
                {% include 'phoxtail_core/svgs/close.html' %}
            </button>
        </div>
    </div>
</form>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('billing-search-input');
        const clearButton = document.getElementById('billing-clear-search');
        const searchIcon = document.getElementById('billing-search-icon');

        if (!searchInput) return;

    // Handle clear button click
        if (clearButton) {
            clearButton.addEventListener('click', function() {
                searchInput.value = '';
                searchIcon.classList.remove('suba-search-hidden');
                clearButton.classList.add('suba-search-hidden');
            });
        }

    // Toggle between search icon and clear button on input
        searchInput.addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                searchIcon.classList.add('suba-search-hidden');
                clearButton.classList.remove('suba-search-hidden');
            } else {
                searchIcon.classList.remove('suba-search-hidden');
                clearButton.classList.add('suba-search-hidden');
            }
        });
    });
</script>
