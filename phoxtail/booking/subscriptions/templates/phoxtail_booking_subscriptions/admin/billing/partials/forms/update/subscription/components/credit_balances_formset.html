<!-- Credit Balances Formset -->
{{ formset.management_form }}
{% for form in formset %}
    <!-- Hidden fields (ID, subscription) -->
    {% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
    <!-- Hidden service field to preserve value -->
    <input type="hidden"
           name="{{ form.service.html_name }}"
           value="{{ form.instance.service.id }}">
    <!-- Credits field with service name as label -->
    {% include "phoxtail_core/forms/widgets/number.html" with field=form.credits label=form.instance.service.name %}
{% endfor %}
