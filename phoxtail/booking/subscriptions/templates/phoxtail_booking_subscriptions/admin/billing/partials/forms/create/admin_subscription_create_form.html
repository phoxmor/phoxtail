{% load tz %}
<div class="suba-modal-overlay"
     onclick="closeModal()"
     data-modal-animation="slide-right"
     data-animation-duration="300ms">
    <div class="suba-drawer" onclick="event.stopPropagation()">
        <div class="suba-drawer__scroll">
            <!-- Header -->
            <div class="suba-drawer__header">
                <div class="suba-drawer__title-row">
                    <h2 class="suba-drawer__title">Create New Subscription</h2>
                    <button class="suba-close-btn"
                            onclick="closeModal()"
                            aria-label="Close modal"
                            type="button">
                        <span class="suba-close-btn__icon">{% include 'phoxtail_core/svgs/close.html' %}</span>
                    </button>
                </div>
            </div>
            <!-- Body -->
            <div class="suba-drawer__body">
                <form id="create-subscription-form"
                      hx-post="{% url 'billing_management:admin_subscription_create' %}"
                      hx-target="#core-modal-placeholder-wrapper"
                      hx-swap="none"
                      hx-include="#billing-filters-form-placeholder">
                    {% csrf_token %}
                    {% include 'phoxtail_booking_subscriptions/admin/billing/partials/forms/create/form_content.html' %}
                </form>
            </div>
            <!-- Footer -->
            <div class="suba-drawer__footer"
                 style="flex-direction: column;
                        align-items: stretch">
                <!-- Admin Actions -->
                <div class="suba-admin-actions">
                    <button class="suba-btn suba-btn--success"
                            type="submit"
                            form="create-subscription-form">
                        {% include 'phoxtail_core/svgs/plus.html' %}
                        <span>Create Subscription</span>
                    </button>
                </div>
                <button class="suba-btn suba-btn--secondary"
                        onclick="closeModal()"
                        type="button">
                    <span>Cancel</span>
                </button>
            </div>
        </div>
    </div>
</div>
{# Hidden form placeholder for OOB syncing field values across HTMX requests #}
<div id="create-subscription-form-placeholder" style="display: none;"></div>
