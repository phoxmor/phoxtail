<!-- Week Navigation Controls -->
<div class="evta-nav">
    <div class="evta-nav-grid">
        <!-- Loading Indicator -->
        <div class="evta-loading htmx-indicator">
            <div class="evta-loading__spinner"></div>
            <span class="evta-loading__text">Loading...</span>
        </div>
        <!-- This Week Button - Full width on mobile, 1 col on larger screens -->
        <button type="button"
                class="evta-nav-btn evta-nav-btn--today {% if is_current_week %}evta-nav-btn--active{% endif %}"
                hx-get="{% url 'scheduling_management:index' %}"
                hx-trigger="click"
                hx-target="#schedule-container"
                hx-swap="innerHTML"
                hx-indicator=".htmx-indicator"
                hx-include="#filters-form-placeholder"
                hx-vals='{"filter-date": "{{ today_date }}"}'>
            {% include 'phoxtail_core/svgs/today.html' %}
            <span>This Week</span>
        </button>
        <!-- Previous Week Button -->
        <button type="button"
                class="evta-nav-btn"
                hx-get="{% url 'scheduling_management:index' %}"
                hx-trigger="click"
                hx-target="#schedule-container"
                hx-swap="innerHTML"
                hx-indicator=".htmx-indicator"
                hx-include="#filters-form-placeholder"
                hx-vals='{"filter-date": "{{ previous_week }}"}'>
            {% include 'phoxtail_core/svgs/chevron_left.html' %}
            <span>Previous</span>
        </button>
        <!-- Next Week Button -->
        <button type="button"
                class="evta-nav-btn"
                hx-get="{% url 'scheduling_management:index' %}"
                hx-trigger="click"
                hx-target="#schedule-container"
                hx-swap="innerHTML"
                hx-indicator=".htmx-indicator"
                hx-include="#filters-form-placeholder"
                hx-vals='{"filter-date": "{{ next_week }}"}'>
            <span>Next</span>
            {% include 'phoxtail_core/svgs/chevron_right.html' %}
        </button>
    </div>
</div>
