{# OOB update: sync hidden form placeholder with current state #}
<div hx-swap-oob="innerHTML:#create-reservation-form-placeholder">
    <input type="hidden" name="user" value="{{ user_value|default:'' }}">

           name="subscription"
           value="{{ subscription_value|default:'' }}">
    <input type="hidden" name="status" value="{{ status_value|default:'' }}">
</div>
