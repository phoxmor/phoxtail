<div class="evta-nav">
    <!-- Loading Indicator -->
    <div class="evta-loading htmx-indicator">
        <div class="evta-loading__spinner"></div>
        <span class="evta-loading__text">Loading...</span>
    </div>
    <!-- Date and Navigation Controls -->
    <div class="evta-nav-grid">
        <!-- Today Button -->
        <button type="button"
                class="evta-nav-btn evta-nav-btn--today{% if is_today %} evta-nav-btn--active{% endif %}"
                hx-get="{% url 'booking_management:index' %}"
                hx-trigger="click"
                hx-target="#calendar-and-events-container"
                hx-swap="innerHTML"
                hx-indicator=".htmx-indicator"
                hx-include="#filters-form-placeholder"
                hx-vals='{"filter-date": "{{ today_date }}"}'>
            {% include 'phoxtail_core/svgs/today.html' with class="icon-md" %}
            <span>Today</span>
        </button>
        <!-- Previous Day Button -->
        <button type="button"
                class="evta-nav-btn"
                hx-get="{% url 'booking_management:index' %}"
                hx-trigger="click"
                hx-target="#calendar-and-events-container"
                hx-swap="innerHTML"
                hx-indicator=".htmx-indicator"
                hx-include="#filters-form-placeholder"
                hx-vals='{"filter-date": "{{ previous_date }}"}'>
            {% include 'phoxtail_core/svgs/chevron_left.html' with class="icon-md" %}
            <span>Previous</span>
        </button>
        <!-- Next Day Button -->
        <button type="button"
                class="evta-nav-btn"
                hx-get="{% url 'booking_management:index' %}"
                hx-trigger="click"
                hx-target="#calendar-and-events-container"
                hx-swap="innerHTML"
                hx-indicator=".htmx-indicator"
                hx-include="#filters-form-placeholder"
                hx-vals='{"filter-date": "{{ next_date }}"}'>
            <span>Next</span>
            {% include 'phoxtail_core/svgs/chevron_right.html' with class="icon-md" %}
        </button>
    </div>
</div>
