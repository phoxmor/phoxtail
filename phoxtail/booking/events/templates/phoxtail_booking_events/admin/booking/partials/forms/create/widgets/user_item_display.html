{# Rich display for User items in the single-select search dropdown and selected state #}
<span style="display: flex; flex: 1; min-width: 0; align-items: flex-start; justify-content: space-between; gap: 0.5rem;">
    <span style="display: flex; flex-direction: column; min-width: 0;">
        <span style="font-size: 0.875rem; font-weight: 500;">{{ item.get_full_name }}</span>
        <span style="font-size: 0.75rem; color: rgb(var(--color-surface-500));">{{ item.email }}</span>
    </span>
    <span style="font-size: 0.6875rem; font-family: monospace; color: rgb(var(--color-surface-400)); white-space: nowrap; padding-top: 0.0625rem;">{{ item.short_id }}</span>
</span>
