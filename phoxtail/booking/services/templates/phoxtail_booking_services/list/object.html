<div class="svc-card">
    <div class="svc-card__body">
        <div class="svc-card__name-row">
            <h3 class="svc-card__name">{{ service.name }}</h3>
            {% if service.is_active %}
                <span class="svc-badge svc-badge--available">Available</span>
            {% else %}
                <span class="svc-badge svc-badge--unavailable">Unavailable</span>
            {% endif %}
        </div>
        {% if service.description %}
            <p class="svc-card__desc">{{ service.description|striptags|truncatewords:30 }}</p>
        {% endif %}
    </div>
    <div class="svc-card__footer">
        <a href="{% url 'dashboard:booking:services:detail' service.uuid %}"
           class="svc-btn">
            View Details
            <span>{% include 'phoxtail_core/svgs/arrow_right_alt.html' %}</span>
        </a>
    </div>
</div>
