{% load phoxtail_design_tags %}
{% for artifact in artifacts %}
<div class="phoxtail-bar-block-row phoxtail-model-row"
     tabindex="0"
     data-artifact-id="{{ artifact.id }}"
     data-artifact-name="{{ artifact.display_name }}"
     {% if artifact.id == default_artifact_id %}data-is-site-default="true"{% endif %}>
    {% icon "cognition_2" class="phoxtail-bar-row-icon" %}
    <div class="phoxtail-bar-row-info">
        <span class="phoxtail-bar-row-type">{{ artifact.display_name }}</span>
        <span class="phoxtail-bar-row-meta">{{ artifact.provider.display_name }} · {{ artifact.identifier }}</span>
    </div>
</div>
{% empty %}
<p class="phoxtail-model-picker-empty">No models configured.</p>
{% endfor %}
