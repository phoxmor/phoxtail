{% load phoxtail_design_tags %}
<div class="phoxtail-media-picker-overlay"
     data-modal-animation="slide-left">
    <div class="phoxtail-media-picker-drawer">
        <div class="phoxtail-bar-panel-header">
            <span class="phoxtail-bar-panel-title">Media</span>
            <button type="button"
                    onclick="closeModalLevel1();"
                    class="phoxtail-bar-panel-close"
                    title="Close">
                {% icon "close" class="phoxtail-bar-btn-icon" %}
            </button>
        </div>

        <div class="phoxtail-media-picker-tabs">
            <button type="button"
                    class="phoxtail-media-picker-tab {% if tab == 'images' %}phoxtail-media-picker-tab--active{% endif %}"
                    hx-get="{% url 'phoxtail_agent:media_picker' %}"
                    hx-vals='{"tab": "images"}'
                    hx-include="#phoxtail-media-picker-search"
                    hx-target="#phoxtail-media-picker-results"
                    hx-swap="innerHTML">
                {% icon "image" class="phoxtail-bar-btn-icon" %}
                Images
            </button>
            <button type="button"
                    class="phoxtail-media-picker-tab {% if tab == 'videos' %}phoxtail-media-picker-tab--active{% endif %}"
                    hx-get="{% url 'phoxtail_agent:media_picker' %}"
                    hx-vals='{"tab": "videos"}'
                    hx-include="#phoxtail-media-picker-search"
                    hx-target="#phoxtail-media-picker-results"
                    hx-swap="innerHTML">
                {% icon "video_library" class="phoxtail-bar-btn-icon" %}
                Videos
            </button>
            <button type="button"
                    class="phoxtail-media-picker-tab {% if tab == 'audio' %}phoxtail-media-picker-tab--active{% endif %}"
                    hx-get="{% url 'phoxtail_agent:media_picker' %}"
                    hx-vals='{"tab": "audio"}'
                    hx-include="#phoxtail-media-picker-search"
                    hx-target="#phoxtail-media-picker-results"
                    hx-swap="innerHTML">
                {% icon "audio_file" class="phoxtail-bar-btn-icon" %}
                Audio
            </button>
            <button type="button"
                    class="phoxtail-media-picker-tab {% if tab == 'documents' %}phoxtail-media-picker-tab--active{% endif %}"
                    hx-get="{% url 'phoxtail_agent:media_picker' %}"
                    hx-vals='{"tab": "documents"}'
                    hx-include="#phoxtail-media-picker-search"
                    hx-target="#phoxtail-media-picker-results"
                    hx-swap="innerHTML">
                {% icon "document" class="phoxtail-bar-btn-icon" %}
                Documents
            </button>
        </div>

        <div class="phoxtail-media-picker-search-wrap">
            <span class="phoxtail-media-picker-search-icon {% if query %}phoxtail-media-picker-hidden{% endif %}"
                  id="phoxtail-media-picker-search-icon">
                {% icon "search" class="phoxtail-bar-btn-icon" %}
            </span>
            <button type="button"
                    id="phoxtail-media-picker-clear"
                    class="phoxtail-media-picker-search-clear {% if not query %}phoxtail-media-picker-hidden{% endif %}"
                    title="Clear search"
                    aria-label="Clear search">
                {% icon "close" class="phoxtail-bar-btn-icon" %}
            </button>
            <input type="text"
                   id="phoxtail-media-picker-search"
                   name="q"
                   value="{{ query }}"
                   placeholder="Search…"
                   autocomplete="off"
                   class="phoxtail-media-picker-search-input"
                   hx-get="{% url 'phoxtail_agent:media_picker' %}"
                   hx-vals='{"tab": "{{ tab }}"}'
                   hx-target="#phoxtail-media-picker-results"
                   hx-trigger="input changed delay:300ms"
                   hx-swap="innerHTML">
        </div>

        <div class="phoxtail-media-picker-results" id="phoxtail-media-picker-results">
            {% include "phoxtail_agent/partials/media_picker_results.html" %}
        </div>

        <div class="phoxtail-media-picker-lightbox"
             id="phoxtail-media-picker-lightbox"
             inert>
            <div class="phoxtail-media-picker-lightbox-inner">
                <div class="phoxtail-bar-panel-header">
                    <span class="phoxtail-bar-panel-title">Preview</span>
                    <button type="button"
                            id="phoxtail-media-picker-lightbox-close"
                            class="phoxtail-bar-panel-close"
                            title="Close preview">
                        {% icon "close" class="phoxtail-bar-btn-icon" %}
                    </button>
                </div>
                <div class="phoxtail-media-picker-lightbox-media">
                    <img class="phoxtail-media-picker-lightbox-img"
                         id="phoxtail-media-picker-lightbox-img"
                         src="" alt=""
                         decoding="async">
                    <video class="phoxtail-media-picker-lightbox-video"
                           id="phoxtail-media-picker-lightbox-video"
                           controls
                           preload="metadata"
                           playsinline
                           style="display:none">
                    </video>
                    <audio class="phoxtail-media-picker-lightbox-audio"
                           id="phoxtail-media-picker-lightbox-audio"
                           controls
                           preload="metadata"
                           style="display:none">
                    </audio>
                </div>
                <div class="phoxtail-media-picker-lightbox-info">
                    <div class="phoxtail-media-picker-lightbox-badges" id="phoxtail-lbx-badges"></div>
                    <h3 class="phoxtail-media-picker-lightbox-title" id="phoxtail-lbx-title"></h3>
                    <div class="phoxtail-media-picker-lightbox-dims" id="phoxtail-lbx-dims"></div>
                    <div class="phoxtail-media-picker-lightbox-desc" id="phoxtail-lbx-desc"></div>
                    <div class="phoxtail-media-picker-lightbox-tags" id="phoxtail-lbx-tags"></div>
                    <div class="phoxtail-media-picker-lightbox-meta-row" id="phoxtail-lbx-meta"></div>
                </div>
                <div class="phoxtail-media-picker-lightbox-actions">
                    <button type="button"
                            class="phoxtail-media-picker-lightbox-close-btn"
                            id="phoxtail-media-picker-lightbox-dismiss">
                        {% icon "close" class="phoxtail-bar-btn-icon" %}
                        Close
                    </button>
                    <button type="button"
                            class="phoxtail-media-picker-lightbox-add-btn"
                            id="phoxtail-media-picker-lightbox-add">
                        {% icon "plus" class="phoxtail-bar-btn-icon" %}
                        Add to chat
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    var input  = document.getElementById('phoxtail-media-picker-search');
    var clear  = document.getElementById('phoxtail-media-picker-clear');
    var icon   = document.getElementById('phoxtail-media-picker-search-icon');
    if (!input) return;

    function syncVisibility() {
        var hasVal = input.value.length > 0;
        icon.classList.toggle('phoxtail-media-picker-hidden', hasVal);
        clear.classList.toggle('phoxtail-media-picker-hidden', !hasVal);
    }
    input.addEventListener('input', syncVisibility);
    if (clear) {
        clear.addEventListener('click', function () {
            input.value = '';
            syncVisibility();
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.focus();
        });
    }

    /* Tab switching — mark active immediately on click, sync search hx-vals */
    document.querySelectorAll('.phoxtail-media-picker-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.phoxtail-media-picker-tab').forEach(function (b) {
                b.classList.remove('phoxtail-media-picker-tab--active');
            });
            btn.classList.add('phoxtail-media-picker-tab--active');
            var newTab = JSON.parse(btn.getAttribute('hx-vals') || '{}').tab;
            if (newTab && input) {
                input.setAttribute('hx-vals', JSON.stringify({ tab: newTab }));
                if (typeof htmx !== 'undefined') htmx.process(input);
            }
        });
    });

    /* Close on mousedown outside drawer — but NOT when clicking inside the chatbot */
    setTimeout(function () {
        function onOutsideDown(e) {
            var drawer = document.querySelector('.phoxtail-media-picker-drawer');
            if (!drawer) { document.removeEventListener('mousedown', onOutsideDown); return; }
            if (drawer.contains(e.target)) return;
            var chatbot = document.getElementById('phoxtail-chatbot-drawer');
            if (chatbot && chatbot.contains(e.target)) return;
            closeModalLevel1();
        }
        document.addEventListener('mousedown', onOutsideDown);
    }, 0);

    /* ── Lightbox ── */
    var lb       = document.getElementById('phoxtail-media-picker-lightbox');
    var lbImg    = document.getElementById('phoxtail-media-picker-lightbox-img');
    var lbVideo  = document.getElementById('phoxtail-media-picker-lightbox-video');
    var lbAudio  = document.getElementById('phoxtail-media-picker-lightbox-audio');
    var lbClose  = document.getElementById('phoxtail-media-picker-lightbox-close');
    var lbAddBtn     = document.getElementById('phoxtail-media-picker-lightbox-add');
    var lbDismissBtn = document.getElementById('phoxtail-media-picker-lightbox-dismiss');
    var _lbThumb = null;

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function fmtBytes(n) {
        n = parseInt(n, 10);
        if (!n) return '';
        if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1048576).toFixed(1) + ' MB';
    }
    function fmtDuration(s) {
        s = parseFloat(s);
        if (!s || isNaN(s)) return '';
        var m = Math.floor(s / 60), sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function openLightbox(thumb) {
        if (!lb) return;
        _lbThumb = thumb;

        var d = thumb.dataset;
        var isVideo = d.mediaType === 'video';
        var isAudio = d.mediaType === 'audio';
        var ext = (d.mediaFileUrl || '').split('.').pop().split('?')[0].toUpperCase();
        var size = fmtBytes(d.mediaFileSize);

        /* Show/hide img vs video vs audio */
        if (lbImg)   lbImg.style.display   = (!isVideo && !isAudio) ? '' : 'none';
        if (lbVideo) lbVideo.style.display = isVideo ? '' : 'none';
        if (lbAudio) lbAudio.style.display = isAudio ? '' : 'none';

        if (isVideo) {
            if (lbVideo) { lbVideo.src = d.mediaFileUrl || ''; lbVideo.load(); }
            if (lbImg)   { lbImg.src = ''; lbImg.alt = ''; }
            if (lbAudio) { lbAudio.pause(); lbAudio.src = ''; }
        } else if (isAudio) {
            if (lbAudio) { lbAudio.src = d.mediaFileUrl || ''; lbAudio.load(); }
            if (lbImg)   { lbImg.src = ''; lbImg.alt = ''; }
            if (lbVideo) { lbVideo.pause(); lbVideo.src = ''; }
        } else {
            if (lbImg) {
                lbImg.src = d.mediaLightboxUrl || d.mediaFileUrl || '';
                lbImg.alt = d.mediaTitle || '';
            }
            if (lbVideo) { lbVideo.pause(); lbVideo.src = ''; }
            if (lbAudio) { lbAudio.pause(); lbAudio.src = ''; }
        }

        /* Badges: ID + format + size/duration */
        var badgesEl = document.getElementById('phoxtail-lbx-badges');
        if (badgesEl) {
            var dur = (isVideo || isAudio) ? fmtDuration(d.mediaDuration) : '';
            var extra = (isVideo || isAudio)
                ? (dur ? '<span class="phoxtail-lbx-badge">' + esc(dur) + '</span>' : '')
                : (size ? '<span class="phoxtail-lbx-badge">' + esc(size) + '</span>' : '');
            badgesEl.innerHTML =
                '<span class="phoxtail-lbx-badge phoxtail-lbx-badge--id">ID ' + esc(d.mediaId || '') + '</span>' +
                (ext ? '<span class="phoxtail-lbx-badge">' + esc(ext) + '</span>' : '') +
                extra;
        }

        /* Title */
        var titleEl = document.getElementById('phoxtail-lbx-title');
        if (titleEl) titleEl.textContent = d.mediaTitle || '';

        /* Dimensions (images and videos only) */
        var dimsEl = document.getElementById('phoxtail-lbx-dims');
        if (dimsEl) dimsEl.textContent = (!isAudio && d.mediaWidth && d.mediaHeight)
            ? d.mediaWidth + ' × ' + d.mediaHeight + ' px' : '';

        /* Description / alt text (images only) */
        var descEl = document.getElementById('phoxtail-lbx-desc');
        if (descEl) {
            var desc = (d.mediaDescription || '').trim();
            descEl.textContent = desc;
            descEl.style.display = (desc && !isVideo && !isAudio) ? '' : 'none';
        }

        /* Tags */
        var tagsEl = document.getElementById('phoxtail-lbx-tags');
        if (tagsEl) {
            var rawTags = (d.mediaTags || '').trim();
            if (rawTags) {
                tagsEl.innerHTML = rawTags.split(',').map(function (t) {
                    t = t.trim();
                    return t ? '<span class="phoxtail-lbx-tag">' + esc(t) + '</span>' : '';
                }).join('');
                tagsEl.style.display = '';
            } else {
                tagsEl.innerHTML = '';
                tagsEl.style.display = 'none';
            }
        }

        /* Meta row: date + collection */
        var metaEl = document.getElementById('phoxtail-lbx-meta');
        if (metaEl) {
            var parts = [];
            if (d.mediaCreatedAt) parts.push('Uploaded ' + d.mediaCreatedAt);
            if (d.mediaCollection) parts.push(d.mediaCollection);
            metaEl.textContent = parts.join(' · ');
        }

        /* Open with animation */
        lb.removeAttribute('inert');
        requestAnimationFrame(function () {
            lb.classList.add('phoxtail-media-picker-lightbox--open');
        });
    }

    function closeLightbox() {
        if (!lb) return;
        lb.classList.remove('phoxtail-media-picker-lightbox--open');
        lb.setAttribute('inert', '');
        if (lbVideo) { lbVideo.pause(); lbVideo.src = ''; }
        if (lbAudio) { lbAudio.pause(); lbAudio.src = ''; }
        _lbThumb = null;
    }

    if (lbClose) {
        lbClose.addEventListener('click', function (e) { e.stopPropagation(); closeLightbox(); });
    }
    if (lbDismissBtn) {
        lbDismissBtn.addEventListener('click', function (e) { e.stopPropagation(); closeLightbox(); });
    }
    if (lb) {
        lb.addEventListener('click', function (e) {
            if (e.target === lb) { e.stopPropagation(); closeLightbox(); }
        });
    }
    if (lbAddBtn) {
        lbAddBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!_lbThumb) return;
            var payload = window.phoxtailMediaPicker && window.phoxtailMediaPicker.payloadFromEl(_lbThumb);
            if (payload && window.phoxtailChat) {
                window.phoxtailChat.addContext(payload);
                lbAddBtn.classList.add('phoxtail-media-picker-lightbox-add-btn--added');
                setTimeout(function () {
                    lbAddBtn.classList.remove('phoxtail-media-picker-lightbox-add-btn--added');
                    closeLightbox();
                }, 600);
            }
        });
    }
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lb && lb.classList.contains('phoxtail-media-picker-lightbox--open')) {
            e.stopPropagation();
            closeLightbox();
        }
    });

    /* Delegated click for images and videos — survives HTMX result swaps */
    var resultsEl = document.getElementById('phoxtail-media-picker-results');
    if (resultsEl) {
        resultsEl.addEventListener('click', function (e) {
            var addBtn = e.target.closest('.phoxtail-media-picker-add-btn');
            if (addBtn) return;
            var thumb = e.target.closest('[data-media-type="image"], [data-media-type="video"], [data-media-type="audio"]');
            if (!thumb) return;
            openLightbox(thumb);
        });
    }
})();
</script>
