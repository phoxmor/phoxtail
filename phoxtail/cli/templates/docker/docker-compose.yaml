services:
  web:
{% if not registry_mode %}
    build:
      target: {{ environment }}
      ssh:
        - default
{% endif %}
    image: {{ image_name }}
    pull_policy: {% if registry_mode %}always{% else %}build{% endif %}

    restart: always
    user: {% if registry_mode %}"1000:1000"{% else %}"${HOST_UID:-1000}:${HOST_GID:-1000}"{% endif %}

    volumes:
{% if not registry_mode %}
      - .:/app
{% endif %}
      - ${HOME}/.phoxtail:/home/app/.phoxtail:ro
{% if registry_mode %}
      - static_files:/app/static
      - media_files:/app/media
{% endif %}
    env_file:
      - ./.env
{% if environment == "development" %}
    ports:
      - "80:80"
{% endif %}
    depends_on:
      - db
      - redis

{% if environment == "development" %}
  # The project's always-on MCP server: the same tool registry the terminal
  # and chatbot use, served over HTTP so any MCP client (Claude Code from
  # anywhere on this machine, sibling projects on the shared net) can run
  # this project's tools in this project's environment. It holds no
  # credentials of its own — each request's Bearer is forwarded to the web
  # API, which is the sole authority.
  #
  # Standalone, it publishes port 8001 on loopback only
  # (http://localhost:8001/mcp — nothing here should be reachable from the
  # LAN). On `phoxtail net attach` the net fragment releases the port and
  # the server moves to http://mcp.<slug>.localhost/mcp instead.
  #
  # Reuses the image `web` builds; runs phoxtail from its site-packages.
  mcp:
    image: {{ image_name }}
    restart: unless-stopped
    command: phoxtail mcp serve --http --host 0.0.0.0 --port 80
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/app
    env_file:
      - ./.env
    environment:
      # Inside this container, `http://localhost` is this MCP server
      # itself, not Django — the API lives in the `web` container, one
      # service-name hop away on the project's default network. Only
      # correct while detached: `net attach` overrides this to
      # `http://<slug>` in the net fragment, because the shared network
      # gives every attached project's `web` the same bare alias.
      PHOXTAIL_API_URL: http://web
    ports:
      - "127.0.0.1:8001:80"
    depends_on:
      - web

{% endif %}
  redis:
    image: redis:7-alpine
    restart: always

  db:
    image: postgres:{{ postgres_version }}
    restart: always
    env_file:
      - ./.env
{% if environment == "development" %}
    ports:
      - "5432:5432"
{% endif %}
    volumes:
      - postgres_data:{{ pg_data_path }}
      - ./db-backups:/db-backups

{% if environment == "production" %}
  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
{% if registry_mode %}
      - static_files:/usr/share/nginx/html/static:ro
      - media_files:/usr/share/nginx/html/media:ro
{% else %}
      - ./static:/usr/share/nginx/html/static
      - ./media:/usr/share/nginx/html/media
{% endif %}
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    profiles: ["ssl"]
    env_file:
      - ./.env
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
{% if registry_mode %}
      - static_files:/usr/share/nginx/html/static:ro
      - media_files:/usr/share/nginx/html/media:ro
{% else %}
      - ./static:/usr/share/nginx/html/static
      - ./media:/usr/share/nginx/html/media
{% endif %}
    depends_on:
      - nginx

{% endif %}
volumes:
  postgres_data:
{% if environment == "production" %}
  certbot_conf:
  certbot_www:
{% if registry_mode %}
  static_files:
  media_files:
{% endif %}
{% endif %}
