services:
  web:
    build:
      target: {{ environment }}
    image: {{ image_name }}
    restart: always
    volumes:
      - .:/app
{% if environment == "development" and phoxtail_source is defined %}
      - {{ phoxtail_source }}:/opt/phoxtail/phoxtail:ro
    environment:
      - PYTHONPATH=/opt/phoxtail
{% endif %}
    env_file:
      - ./.env
{% if environment == "development" %}
    ports:
      - "80:80"
{% endif %}
    depends_on:
      - db

  db:
    image: postgres:{{ postgres_version }}
    restart: always
    env_file:
      - ./.env
{% if environment == "development" %}
    ports:
      - "5432:5432"
{% endif %}
    volumes:
      - postgres_data:{{ pg_data_path }}
      - ./db-backups:/db-backups

{% if environment == "development" %}
  docs:
    image: {{ image_name }}
    profiles: ["docs"]
    working_dir: /app/docs
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: sh -c "mkdocs serve --dev-addr 0.0.0.0:8000"

{% elif environment == "production" %}
  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static:/usr/share/nginx/html/static
      - ./media:/usr/share/nginx/html/media
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    profiles: ["ssl"]
    env_file:
      - ./.env
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./static:/usr/share/nginx/html/static
      - ./media:/usr/share/nginx/html/media
    depends_on:
      - nginx

{% endif %}
volumes:
  postgres_data:
