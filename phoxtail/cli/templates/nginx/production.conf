worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Docker internal DNS resolver (Fixes 3s delay with HTTP/2)
    # Forces Nginx to use IPv4 for container resolution
    # valid=10s: without it nginx honours Docker's DNS TTL, so a recreated
    # container can stay unreachable for minutes after a deploy.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # File upload size limits
    client_max_body_size 50M;
    client_body_buffer_size 50M;

    # SSL configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name {{ server_name }};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri $uri/ =404;
        }

        location / {
            return 301 https://{{ redirect_target }}$request_uri;
        }
    }

{% if wildcard %}
    # Main HTTPS Block (Handles root and all subdomains)
    server {
        listen 443 ssl;
        http2 on;
        server_name {{ server_name }};

        ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        location / {
            # Resolve `web` per request, not once at startup: every deploy
            # recreates the container with a new IP, and a literal hostname in
            # proxy_pass is looked up only when nginx boots — leaving nginx
            # proxying to a dead address (502) until it is restarted. A
            # variable upstream forces the lookup through `resolver` above.
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_request_buffering on;
            proxy_max_temp_file_size 50M;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
{% else %}
    # Redirect HTTPS www to non-www
    server {
        listen 443 ssl;
        http2 on;
        server_name www.{{ domain }};

        ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

        location / {
            return 301 https://{{ domain }}$request_uri;
        }
    }

    # Main server block (non-www HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name {{ domain }};

        ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        location / {
            # Resolve `web` per request, not once at startup: every deploy
            # recreates the container with a new IP, and a literal hostname in
            # proxy_pass is looked up only when nginx boots — leaving nginx
            # proxying to a dead address (502) until it is restarted. A
            # variable upstream forces the lookup through `resolver` above.
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_request_buffering on;
            proxy_max_temp_file_size 50M;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
{% endif %}
}
