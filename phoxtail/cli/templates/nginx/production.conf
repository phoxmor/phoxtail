worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Docker internal DNS resolver (Fixes 3s delay with HTTP/2)
    # Forces Nginx to use IPv4 for container resolution
    # valid=10s: without it nginx honours Docker's DNS TTL, so a recreated
    # container can stay unreachable for minutes after a deploy.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # File upload size limits
    client_max_body_size 50M;
    client_body_buffer_size 50M;

    # The two endpoints anyone on the internet may call before logging in:
    # a client registering itself, and the authorization request that
    # resolves a client and renders the consent screen. Counted per
    # client address — the only handle an unauthenticated request offers
    # — ten a minute, with a burst wide enough for a person's retries
    # and a client's retry after a 401; the next is answered 429 rather
    # than queued, so a flood never occupies a worker waiting. Not the
    # token endpoint, where a refused refresh is a person logged out, and
    # not the MCP server, where one session is many authenticated calls.
    limit_req_zone $binary_remote_addr zone=oauth:10m rate=10r/m;

    # SSL configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name {{ server_name }};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri $uri/ =404;
        }

        location / {
            return 301 https://{{ redirect_target }}$request_uri;
        }
    }

    # The MCP server's own port 80: certbot's challenge, then an upgrade
    # to the same host — never to the site's, which would be the
    # cross-origin redirect the connector must never meet.
    server {
        listen 80;
        server_name mcp.{{ domain }};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri $uri/ =404;
        }

        location / {
            return 301 https://mcp.{{ domain }}$request_uri;
        }
    }

{% if wildcard %}
    # Main HTTPS Block (Handles root and all subdomains)
    server {
        listen 443 ssl;
        http2 on;
        server_name {{ server_name }};

        ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        location / {
            # Resolve `web` per request, not once at startup: every deploy
            # recreates the container with a new IP, and a literal hostname in
            # proxy_pass is looked up only when nginx boots — leaving nginx
            # proxying to a dead address (502) until it is restarted. A
            # variable upstream forces the lookup through `resolver` above.
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_request_buffering on;
            proxy_max_temp_file_size 50M;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /o/register/ {
            limit_req zone=oauth burst=20 nodelay;
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /o/authorize/ {
            limit_req zone=oauth burst=20 nodelay;
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
{% else %}
    # Redirect HTTPS www to non-www
    server {
        listen 443 ssl;
        http2 on;
        server_name www.{{ domain }};

        ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

        location / {
            return 301 https://{{ domain }}$request_uri;
        }
    }

    # Main server block (non-www HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name {{ domain }};

        ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        location / {
            # Resolve `web` per request, not once at startup: every deploy
            # recreates the container with a new IP, and a literal hostname in
            # proxy_pass is looked up only when nginx boots — leaving nginx
            # proxying to a dead address (502) until it is restarted. A
            # variable upstream forces the lookup through `resolver` above.
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_request_buffering on;
            proxy_max_temp_file_size 50M;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /o/register/ {
            limit_req zone=oauth burst=20 nodelay;
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /o/authorize/ {
            limit_req zone=oauth burst=20 nodelay;
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
{% endif %}

    # The MCP server, on its own origin. Every trust rule the connector is
    # built on is keyed on this exact name — the door's host allowlist,
    # the resource document, the audience a key names — so nothing here
    # may redirect, rewrite the path or change the Host: a request for
    # mcp.{{ domain }}/mcp must arrive at the door exactly as sent. No
    # rate limit: one session is many requests, every one authenticated.
    server {
        listen 443 ssl;
        http2 on;
        server_name mcp.{{ domain }};

        ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

        add_header X-Content-Type-Options nosniff;

        location / {
            set $upstream_mcp mcp;
            proxy_pass http://$upstream_mcp:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # A streaming session stays open far longer than a page load.
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
