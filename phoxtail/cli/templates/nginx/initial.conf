worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    client_max_body_size 50M;
    client_body_buffer_size 50M;

    # Docker internal DNS, used by the variable upstream below.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            # Resolve `web` per request, not once at startup — see the same
            # note in production.conf.
            set $upstream_web web;
            proxy_pass http://$upstream_web:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_request_buffering on;
            proxy_max_temp_file_size 50M;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
        }
    }
}
