{% load wagtailcore_tags %}
{% with variant=bound_block.value.variant %}
<div id="phoxtail-block-{{ bound_block.id }}"
     class="phoxtail-block"
     data-phoxtail-bar-copy="block"
     data-phoxtail-bar-uuid="{{ bound_block.id }}"
     data-phoxtail-bar-type="{{ bound_block.block_type }}"
     {% if variant %}data-phoxtail-bar-variant-id="{{ variant.id }}" data-phoxtail-bar-variant-identifier="{{ variant.identifier }}"{% endif %}
     {% if page_id %}hx-get="{% url 'phoxtail_agent:render_block_fragment' page_id=page_id block_uuid=bound_block.id %}"
     hx-trigger="phoxtail:block-refresh"
     hx-swap="outerHTML"
     hx-indicator="#phoxtail-block-{{ bound_block.id }}-indicator"{% endif %}>
    <span id="phoxtail-block-{{ bound_block.id }}-indicator"
          class="phoxtail-block-refresh-indicator htmx-indicator"
          aria-hidden="true"></span>
    {% include_block bound_block %}
</div>
{% endwith %}
