{% include 'phoxtail_core/forms/widgets/htmx/single_select_search/input.html' with widget_id="remote" search_placeholder="Search remotes" %}
{% if selected_remote %}
    <div hx-swap-oob="innerHTML:#streams-results">
        <div hx-get="{% url 'streams-sync:streams' %}?remote={{ selected_remote.pk }}"
             hx-trigger="load"
             hx-swap="innerHTML">
            <div class="ss-streams-loading">Loading…</div>
        </div>
    </div>
{% else %}
    <div hx-swap-oob="innerHTML:#streams-results">
        <div class="ss-empty">
            <h3 class="ss-empty__title">No remote selected</h3>
            <p class="ss-empty__text">Select a remote above to view its streams.</p>
        </div>
    </div>
{% endif %}
