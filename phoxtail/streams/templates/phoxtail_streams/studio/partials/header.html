{% load i18n phoxtail_design_tags %}
{% url 'phoxtail_core:modal' as core_modal_url %}
{% url 'studio:context_modal' as context_modal_url %}
<div class="stu-header">
    <div class="stu-header-inner">
        <div class="stu-header-content">
            <!-- Title Section -->
            <div class="stu-header-title-section">
                <h1 class="stu-header-title">{% trans "Stream Studio" %}</h1>
                <p class="stu-header-subtitle">{% trans "AI-Powered UI Components" %}</p>
            </div>
            <!-- Context Button -->
            <button type="button"
                    class="stu-context-btn"
                    hx-get="{{ core_modal_url }}"
                    hx-vals='{"content_url": "{{ context_modal_url }}"}'
                    hx-include="#context-form-placeholder"
                    hx-target="#core-modal-placeholder-wrapper"
                    hx-swap="innerHTML">
                {% with class="" %}
                    {% icon "flowchart" %}
                {% endwith %}
                <span class="stu-context-btn-label">{% trans "Configure Context" %}</span>
            </button>
        </div>
    </div>
</div>
