{% load i18n phoxtail_design_tags %}
<!-- Context Modal Content -->
<div class="stu-modal-wrapper"
     onclick="closeModal()"
     data-modal-animation="slide-right"
     data-animation-duration="300ms">
    <div class="stu-modal-panel" onclick="event.stopPropagation()">
        <div class="stu-modal-inner">
            <!-- Header -->
            <div class="stu-modal-header">
                <div class="stu-modal-header-row">
                    <div class="stu-modal-header-title-group">
                        {% icon "flowchart" %}
                        <h2 class="stu-modal-title">{% trans "Configure Context" %}</h2>
                    </div>
                    <button class="stu-modal-close-btn"
                            onclick="closeModal()"
                            aria-label="Close modal"
                            type="button">
                        {% icon "close" %}
                    </button>
                </div>
            </div>
            <!-- Content -->
            <div class="stu-modal-body">
                <div id="context-modal-content">{% include 'phoxtail_streams/studio/partials/forms/context/modal_content.html' %}</div>
            </div>
        </div>
    </div>
</div>
