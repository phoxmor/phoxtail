<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <!-- Background -->
  <rect width="360" height="640" fill="#f3f4f6"/>

  <!-- Border -->
  <rect x="1" y="1" width="358" height="638" fill="none" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Image icon -->
  <g transform="translate(130, 270)">
    <!-- Frame -->
    <rect x="0" y="0" width="100" height="80" rx="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>

    <!-- Mountain -->
    <polygon points="15,65 40,35 55,50 75,25 85,65" fill="#9ca3af"/>

    <!-- Sun -->
    <circle cx="25" cy="25" r="10" fill="#9ca3af"/>
  </g>

  <!-- Text -->
  <text x="180" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">
    Image Placeholder
  </text>
  <text x="180" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
    9:16 Portrait
  </text>
</svg>
